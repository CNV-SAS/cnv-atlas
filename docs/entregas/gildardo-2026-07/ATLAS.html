// ── MOTOR DE REGLAS EFR (Diana) — compone SIEMPRE las tarjetas desde los 4 niveles ──
// Letras: IFC/FFMI → A=Alto(óptimo) · N=Normal · B=Bajo(adverso)
//          IRC/FMI  → A=Alto(adverso) · N=Normal · B=Bajo(óptimo)
const efrCompose = (i, r, f, m) => {
  const ifcAdv = i === "B", ircAdv = r === "A", ffmiAdv = f === "B", fmiAdv = m === "A";
  const adverse = ifcAdv || ircAdv || ffmiAdv || fmiAdv;
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  // 1) Enfermedades / complicaciones probables
  const dxP = [];
  if (ffmiAdv && fmiAdv) dxP.push("obesidad sarcopénica");
  if (fmiAdv) dxP.push("síndrome metabólico, resistencia a la insulina, DM2, hígado graso metabólico, dislipidemia");
  if (ffmiAdv && !fmiAdv) dxP.push("sarcopenia, desnutrición proteico-energética, fragilidad");
  if (ircAdv) dxP.push("inflamación sistémica de bajo grado con expansión extracelular/edema");
  if (ifcAdv) dxP.push("disfunción celular con riesgo nutricional");
  const dx = adverse ? cap(dxP.join("; ")) + "." : "No se identifican patologías asociadas: perfil de bajo riesgo, prioridad de mantenimiento.";
  // 2) Mecanismos bioquímicos / disfunción celular
  const mecP = [];
  if (ifcAdv) mecP.push("alteración de membrana y bomba Na⁺-K⁺-ATPasa (pérdida de integridad celular)");

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

<body>

<button class="print-btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>

<div class="header">
  <div>
    <div class="sub">CNV · Sistema ANI BIS-E · Historia Clínica Bioeléctrica</div>
    <h1>${(enc && enc.nombre) || "Paciente"}</h1>
    <div class="sub">${edad} años · ${(enc && enc.sexo) || "—"} · ${(enc && enc.motivo) || "Evaluación nutricional"}</div>
  </div>
  <div class="fecha">
    <div><strong>Fecha:</strong> ${fecha}</div>
    <div><strong>Profesional:</strong> ${(enc && enc.profesional) || "—"}${(enc && enc.tipoProfesionalConsulta) ? " · "+enc.tipoProfesionalConsulta : ""}</div>
    <div><strong>N° Historia:</strong> ${(enc && enc.documento) || "—"}</div>
  </div>
</div>

<!-- 1. DATOS DEL PACIENTE -->
<div class="seccion">
  <div class="sec-titulo">1. Datos del Paciente</div>
  <div class="grid-4">
    <div class="kpi"><div class="val">${edad}</div><div class="lbl">Edad (años)</div></div>
    <div class="kpi"><div class="val">${(enc && enc.sexo) || "—"}</div><div class="lbl">Sexo</div></div>
    <div class="kpi"><div class="val">${(enc && enc.peso) || "—"}</div><div class="lbl">Peso (kg)</div></div>
    <div class="kpi"><div class="val">${(enc && enc.tallaCm) || "—"}</div><div class="lbl">Talla (cm)</div></div>
  </div>
  <div class="grid-4" style="margin-top:7px">
    <div class="kpi"><div class="val">${imc}</div><div class="lbl">IMC (kg/m²)</div></div>
    <div class="kpi"><div class="val">${cintura>0?cintura:"—"}</div><div class="lbl">Cintura (cm)</div></div>
    <div class="kpi"><div class="val">${icc>0?icc.toFixed(3):"—"}</div><div class="lbl">ICC</div></div>
    <div class="kpi"><div class="val">${ict>0?ict.toFixed(3):"—"}</div><div class="lbl">ICT</div></div>
  </div>
  ${enc && (_enc$d5_ = enc.d5_39) && _enc$d5_.length ? "<p style='margin-top:7px;font-size:8.5pt;color:#546e7a'><strong>Diagnósticos:</strong> " + dx.join(", ") + "</p>" : ""}
  ${enc && (_enc$d5_2 = enc.d5_40) && (_enc$d5_2$filter = _enc$d5_2.filter) && _enc$d5_2$filter.call(_enc$d5_2, function(x){ return x !== "Ninguno"; }).length ? "<p style='font-size:8.5pt;color:#546e7a'><strong>Medicación:</strong> " + (enc.d5_40 || []).join(", ") + "</p>" : ""}
</div>

<!-- 2. DIAGNÓSTICO BIOELÉCTRICO -->
<div class="seccion">
  <div class="sec-titulo">2. Diagnóstico Bioeléctrico · ANI BIS-E</div>
  <div class="argumento">Base científica (Slide 44 · CNV 2026): Un BIS alterado es evidencia de que los sustratos físicos están comprometidos (iones, fosfolípidos, micronutrientes). Prescribir el nutracéutico es la consecuencia lógica del diagnóstico — no una recomendación comercial.</div>
  <div class="grid-4">
    <div class="kpi">
      <div class="val" style="color:${ifcCl.c}">${ifc.toFixed(2)}</div>
      <div class="lbl">IFC · Función Celular</div>
      <div class="clf" style="color:${ifcCl.c}">${ifcCl.l}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${ircCl.c}">${irc.toFixed(2)}</div>
      <div class="lbl">IRC · Riesgo Celular</div>
      <div class="clf" style="color:${ircCl.c}">${ircCl.l}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${pabuCl.c}">${pabu.toFixed(3)}</div>
      <div class="lbl">PABU · Proporcionalidad</div>
      <div class="clf" style="color:${pabuCl.c}">${pabuCl.l}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${Number(icaBis)>0.8?"#e65100":"#2e7d32"}">${icaBis}</div>
      <div class="lbl">ICA-BIS · Desv. φ</div>
      <div class="clf" style="color:#546e7a">PABU ${pabu.toFixed(3)}</div>
    </div>
  </div>
  <div class="grid-4" style="margin-top:7px">
    <div class="kpi">
      <div class="val" style="color:${iscmCl.c}">${iscm.toFixed(2)}</div>
      <div class="lbl">ISCM · Síndrome Celular</div>
      <div class="clf" style="color:${iscmCl.c}">${iscmCl.l}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${iehhCl.c}">${iehh.toFixed(2)}</div>
      <div class="lbl">IEHH · Hidro-Homeost.</div>
      <div class="clf" style="color:${iehhCl.c}">${iehhCl.l}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:#1565c0">${ebBis.toFixed(1)}</div>
      <div class="lbl">EB-BIS · Edad Biol. (a)</div>
      <div class="clf" style="color:#546e7a">Cronológica: ${edad}a</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${iaeCl.c}">${iae>0?"+":""}${iae.toFixed(1)}</div>
      <div class="lbl">IAE · Índice Aceleración</div>
      <div class="clf" style="color:${iaeCl.c}">${iaeCl.l}</div>
    </div>
  </div>
  <div class="grid-4" style="margin-top:7px">
    <div class="kpi">
      <div class="val" style="color:${afCl?afCl.c:'#546e7a'}">${af>0?af.toFixed(2):"—"}${af>0?"°":""}</div>
      <div class="lbl">AF · Ángulo de Fase</div>
      <div class="clf" style="color:${afCl?afCl.c:'#94a3b8'}">${afCl?afCl.l:"Sin dato"}</div>
      <div style="font-size:6.5pt;color:#94a3b8;margin-top:2px">${sexoK==="M"?"H: &lt;6.0° Riesgo · 6.0–7.7° Normal · &gt;7.7° Ideal":"M: &lt;6.0° Riesgo · 6.0–6.5° Normal · &gt;6.5° Ideal"}</div>
    </div>
    <div class="kpi">
      <div class="val" style="color:${irCl?irCl.c:'#546e7a'}">${ir>0?ir.toFixed(3):"—"}</div>
      <div class="lbl">IR · Radio de Impedancia</div>
      <div class="clf" style="color:${irCl?irCl.c:'#94a3b8'}">${irCl?irCl.l:"Sin dato"}</div>
      <div style="font-size:6.5pt;color:#94a3b8;margin-top:2px">${sexoK==="M"?"H: &lt;7.8 Normal · ≥7.8 Inflamación BG":"M: &lt;0.82 Normal · ≥0.82 Inflamación BG"}</div>
    </div>
  </div>
  <p style="margin-top:8px;font-size:8.5pt;color:#546e7a">Estado Diana: <strong>#${(bis&&(bis.efrNum||bis.estadoDiana))||"—"}</strong> · Anillo (IFC×IRC): <strong>${(bis&&(bis.anilloId||bis.anillo))||"—"}</strong> · Radio (FFMI×FMI): <strong>${(bis&&(bis.radioId||bis.sector))||"—"}</strong></p>
  <p style="margin-top:4px;font-size:8.5pt;color:#546e7a">Composición: FFMI <strong style="color:${ffmi>0?ffmiCl.c:"#546e7a"}">${ffmi>0?ffmi.toFixed(1):"—"}</strong> (${ffmi>0?ffmiCl.l:"—"}) · FMI <strong style="color:${fmi>0?fmiCl.c:"#546e7a"}">${fmi>0?fmi.toFixed(1):"—"}</strong> (${fmi>0?fmiCl.l:"—"}) · SMM ${smm>0?smm.toFixed(1)+" kg":"—"} · ACT ${act>0?act.toFixed(1)+" L":"—"}</p>
</div>

<!-- 3. RUTAS DE INTERVENCIÓN -->
<div class="seccion">
  <div class="sec-titulo">3. Rutas de Intervención · derivadas del DFI</div>
  ${rutasActivas.length>1 ? '<div class="argumento">⚠️ '+rutasActivas.length+' rutas activas simultáneamente — son aditivas y sinérgicas. Eje principal: '+rutasActivas[0].id+' — '+rutasActivas[0].label+'.</div>' : ""}
  ${rutasActivas.map(function(r){
    var comp = r.componentes || {};
    var blo = function(t,ic,arr){ return (arr&&arr.length)? '<div style="margin-top:4px"><strong style="font-size:8pt">'+ic+' '+t+':</strong> <span style="font-size:8pt;color:#546e7a">'+arr.join(" · ")+'</span></div>' : ""; };
    var nutr = (comp.nutricional && comp.nutricional.aplica!==false) ? blo("Nutricional","🥗",comp.nutricional.indicaciones) : "";
    var ejer = (comp.ejercicio && comp.ejercicio.aplica!==false) ? blo("Ejercicio","💪",comp.ejercicio.indicaciones) : "";
    var psic = (comp.psicologico && comp.psicologico.aplica) ? blo("Psicológico","🧠",comp.psicologico.indicaciones) : "";
    var seg  = comp.seguimiento ? '<div style="margin-top:4px"><strong style="font-size:8pt">📅 Seguimiento:</strong> <span style="font-size:8pt;color:#546e7a">'+(comp.seguimiento.frecuencia||"—")+(comp.seguimiento.criterio_egreso?(" · Egreso: "+comp.seguimiento.criterio_egreso):"")+'</span></div>' : "";
    return '<div class="ruta" style="background:'+r.color+'0e;border-left-color:'+r.color+'"><h4 style="color:'+r.color+'">'+(r.icono||"")+' '+r.id+' — '+r.label+'</h4><p><strong>Activación:</strong> '+r.activacion+'</p>'+nutr+ejer+psic+seg+'</div>';
  }).join("")}
</div>

<!-- 4. PROTOCOLO CELLEVIT / VITACELLEBIS -->
<div class="seccion">
  <div class="sec-titulo">4. Protocolo CELLEVIT · VITACELLEBIS Indicado</div>
  ${nutrasHTML.length > 0
    ? `<table>
        <tr><th>Producto</th><th>Prioridad</th><th>Justificación clínica</th><th>Dosis</th><th>Duración</th></tr>
        ${nutrasHTML.map(function(n){ return '<tr><td><strong>'+(n.nombre||n.n)+'</strong></td><td>'+(n.prioridad===1?"🔴 P1 Urgente":n.prioridad===2?"🟡 P2 Indicado":"🟢 P3 Preventivo")+'</td><td>'+(n.razon||"—")+'</td><td>'+(n.dosis||"—")+'</td><td>'+(n.duracion||n.dur||"—")+'</td></tr>'; }).join("")}
      </table>`
    : '<p style="color:#546e7a;font-size:9pt">Sin rutas activas — Ruta 6: Mantenimiento y Optimización.</p>'
  }
</div>

<!-- 5. PLAN NUTRICIONAL (si aplica) -->
${proto && proto.get ? `<div class="seccion">
  <div class="sec-titulo">5. Plan Nutricional · Fórmula ${tipoProfesional==="nutricionista"?"Sintética":""}</div>
  <div class="grid-4">
    <div class="kpi"><div class="val">${((sintEdit && sintEdit.kcal_obj) || ((_proto$kcal_obj = proto.kcal_obj) && _proto$kcal_obj) || proto.get || 0).toLocaleString()}</div><div class="lbl">kcal objetivo/día</div></div>
    <div class="kpi"><div class="val">${(sintEdit && sintEdit.prot_g) || proto.prot_g || "—"}g</div><div class="lbl">Proteína (${proto.prot_kg||"—"}g/kg)</div></div>
    <div class="kpi"><div class="val">${(sintEdit && sintEdit.fat_g) || "—"}g</div><div class="lbl">Grasas</div></div>
    <div class="kpi"><div class="val">${(sintEdit && sintEdit.cho_g) || "—"}g</div><div class="lbl">Carbohidratos</div></div>
  </div>
  ${proto.isSarco ? '<p style="margin-top:7px;font-size:8.5pt;color:#c62828">⚠️ Sarcopenia activa — NO prescribir déficit calórico. Prioridad: incrementar FFMI.</p>' : ""}
  ${proto.isObesidad && !proto.isSarco ? '<p style="margin-top:7px;font-size:8.5pt;color:#e65100">⚠️ Déficit calórico controlado −400/−500 kcal/día. Proteína preservada para evitar pérdida muscular.</p>' : ""}
  ${(function(){
    var protG_r=Number((sintEdit&&sintEdit.prot_g)||proto.prot_g)||0;
    var fatG_r=Number((sintEdit&&sintEdit.fat_g)||0)||0;
    var kcalR=Number((sintEdit&&sintEdit.kcal_obj)||proto.kcal_obj||proto.get)||0;
    var choG_r=kcalR&&protG_r&&fatG_r?Math.round((kcalR-protG_r*4-fatG_r*9)/4):0;
    if(!protG_r||!choG_r) return "";
    var COLS_E=[
      {label:"Lácteos",gi:[2],kcal:103},{label:"Carnes/Huevo",gi:[0,1],kcal:85},
      {label:"Leguminosas",gi:[3],kcal:121},{label:"Cereales",gi:[4,5],kcal:119},
      {label:"Tubérculos",gi:[6],kcal:68},{label:"Verduras",gi:[8],kcal:24},
      {label:"Frutas",gi:[7],kcal:60},{label:"Grasas",gi:[9,10],kcal:47},
      {label:"Azúcares",gi:[],kcal:16}
    ];
    var TIEMPOS_R=[
      {id:"desayuno",n:"Desayuno",p:0.25},{id:"mediasOnces",n:"Medias onces",p:0.10},
      {id:"almuerzo",n:"Almuerzo",p:0.30},{id:"algo",n:"Algo",p:0.10},
      {id:"cena",n:"Cena",p:0.20},{id:"merienda",n:"Merienda",p:0.05}
    ];
    var tVivos=TIEMPOS_R.filter(function(t){return tiemposActivosR[t.id];});
    var totalP=tVivos.reduce(function(s,t){return s+t.p;},0)||1;
    var tNorm=tVivos.map(function(t){return Object.assign({},t,{p:t.p/totalP});});
    var porcTotR=calcPorcionesANI(protG_r,choG_r,fatG_r);
    var porcWorkR=GRUPOS_ANI.map(function(_,gi){return distribPorTiemposANI(porcTotR[gi]||0,tNorm);});
    function getVR(tiIdx,ci){
      var ck="S_"+tiIdx+"_"+ci;
      return porcionesEditR[ck]!==undefined?porcionesEditR[ck]:COLS_E[ci].gi.reduce(function(s,gi){return s+(porcWorkR[gi]&&porcWorkR[gi][tiIdx]!=null?porcWorkR[gi][tiIdx]:0);},0);
    }
    var hdrs=COLS_E.map(function(c){return '<th style="padding:4px 3px;font-size:7.5pt;text-align:center;min-width:42px;background:#fffbeb">'+c.label+'</th>';}).join("");
    var rows=tNorm.map(function(t,ti){
      var kcalT=COLS_E.reduce(function(s,c,ci){return s+getVR(ti,ci)*c.kcal;},0);
      var cells=COLS_E.map(function(c,ci){return '<td style="padding:3px 3px;text-align:center;font-size:8pt;border:1px solid #fef3c7">'+getVR(ti,ci)+'</td>';}).join("");
      return '<tr><td style="padding:4px 7px;font-weight:700;font-size:8.5pt;border:1px solid #fed7aa;background:#fffbeb">'+t.n+' <span style="color:#94a3b8;font-size:7pt;font-weight:400">'+Math.round(t.p*100)+'%</span></td>'+cells+'<td style="padding:3px 6px;font-weight:700;font-size:8.5pt;background:#fef9c3;text-align:center;border:1px solid #fed7aa">'+Math.round(kcalT)+'</td></tr>';
    }).join("");
    var totRow='<tr style="background:#fffbeb;font-weight:800"><td style="padding:5px 7px;font-size:8pt;border:1px solid #fed7aa">TOTAL porciones/día</td>'+COLS_E.map(function(c,ci){var tot=tNorm.reduce(function(s,t,ti){return s+getVR(ti,ci);},0);return '<td style="padding:3px 3px;text-align:center;font-size:8pt;border:1px solid #fed7aa">'+Math.round(tot*10)/10+'</td>';}).join("")+'<td style="padding:3px 6px;background:#fef08a;font-size:9pt;font-weight:900;text-align:center;border:1px solid #fed7aa">'+(kcalR||"—")+'</td></tr>';
    return '<div style="margin-top:11px"><div style="font-size:8.5pt;font-weight:800;color:#b45309;margin-bottom:6px">🍽️ FÓRMULA DESARROLLADA — Plan por grupos de alimentos</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#fffbeb"><th style="padding:5px 7px;text-align:left;font-size:8.5pt;min-width:80px;border:1px solid #fed7aa">Tiempo</th>'+hdrs+'<th style="padding:4px 6px;background:#fef9c3;font-size:7.5pt;text-align:center;border:1px solid #fed7aa">kcal</th></tr></thead><tbody>'+rows+totRow+'</tbody></table></div></div>';
  })()}
  ${menuEdit && tipoProfesional==="nutricionista" ? `
  <div style="margin-top:11px">
    <div style="font-size:8.5pt;font-weight:800;color:#00695c;margin-bottom:7px">🍽️ MENÚ DE LA SEMANA</div>
    ${Array.isArray(menuEdit)
      ? `<table><tr><th>Día</th><th>Desayuno</th><th>Mer.AM</th><th>Almuerzo</th><th>Algo</th><th>Cena</th></tr>
         ${["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"].map(function(d,di){
           return '<tr><td><strong>'+d+'</strong></td>'+((menuEdit[di]||[]).slice(0,5).map(function(c){ return '<td>'+(c||"—")+'</td>'; }).join(""))+'</tr>';
         }).join("")}</table>`
      : `<div style="font-size:8.5pt;line-height:1.6;white-space:pre-wrap;padding:7px 11px;background:#f8fffe;border-radius:8px">${menuEdit}</div>`
    }
  </div>` : ""}
</div>` : ""}

<!-- 6. OBJETIVOS A 90 DÍAS -->
<div class="seccion">
  <div class="sec-titulo">6. Objetivos a 90 Días</div>
  <table>
    <tr><th>Índice BIS</th><th>Basal</th><th>Objetivo 90 días</th><th>Dirección</th></tr>
    ${ifc>0?`<tr><td>IFC · Función Celular</td><td>${ifc.toFixed(2)}</td><td>≥ ${(ifc+1.0).toFixed(2)}</td><td>↑ Incrementar</td></tr>`:""}
    ${irc>0?`<tr><td>IRC · Riesgo Celular</td><td>${irc.toFixed(2)}</td><td>≤ ${Math.max(0,irc-0.5).toFixed(2)}</td><td>↓ Reducir</td></tr>`:""}
    ${iae>0?`<tr><td>IAE · Aceleración del Envejecimiento</td><td>+${iae.toFixed(1)} a</td><td>≤ +${Math.max(0,iae-5).toFixed(1)} a</td><td>↓ Reducir</td></tr>`:""}
    ${pabu>0?`<tr><td>ICA-BIS (→ φ)</td><td>${icaBis}</td><td>≤ ${Math.max(0,Number(icaBis)-0.8).toFixed(3)}</td><td>↓ Acercar a φ=1,618</td></tr>`:""}
    ${ffmi>0?`<tr><td>FFMI · Masa libre de grasa</td><td>${ffmi.toFixed(1)} kg/m²</td><td>≥ ${(ffmi+0.5).toFixed(1)} kg/m²</td><td>↑ Incrementar</td></tr>`:""}
    ${iscm>0?`<tr><td>ISCM · Síndrome Celular</td><td>${iscm.toFixed(2)}</td><td>≤ ${(iscm-0.5).toFixed(2)}</td><td>↓ Reducir</td></tr>`:""}
  </table>

  const nivelIR = sexoM

    'normal_normal':{ id:4, nombre:'Riesgo basal',          riesgo:'moderado', color:'#eab308' },
    'alto_alto':    { id:5, nombre:'Riesgo compensado',     riesgo:'moderado', color:'#f59e0b' },

    'normal_alto':  { id:7, nombre:'Riesgo inflamatorio',   riesgo:'alto',     color:'#dc2626' },

    ? { nombre:'Sin datos', riesgo:'bajo', color:'#94a3b8' }
    : ei < 0.35  ? { nombre:'Déficit extracelular/deshidratación', riesgo:'bajo',     color:'#3b82f6' }
    : ei <= 0.40 ? { nombre:'Equilibrio hídrico óptimo',           riesgo:'óptimo',   color:'#16a34a' }
    : ei <= 0.50 ? { nombre:'Sobrecarga extracelular leve',        riesgo:'moderado', color:'#f59e0b' }

function efrCompose(i,r,f,m){

function rc(a,b){

var i=0;while(i<s.length-1&&s[i+1].t<t)i++;

var x=s[i],z=s[i+1],l=(t-x.t)/(z.t-x.t);
return"rgb("+Math.round(x.r+(z.r-x.r)*l)+","+Math.round(x.g+(z.g-x.g)*l)+","+Math.round(x.b+(z.b-x.b)*l)+")";}

// ── DFI · Diagnóstico Funcional Integrado (inlinado desde DFI.jsx) ──────────
// Motor puro (computeDFI) + vista (React.createElement). Recibe un `idx` ya
// clasificado en el vocabulario de niveles (Alto/Normal/Bajo, Enlentecido/…),
// que el componente construye con un adaptador desde los clasificadores ATLAS.
const _DFI_SEVC = ["#10b981", "#f59e0b", "#ea580c", "#ef4444"];
const _DFI_SEVL = ["Óptimo", "Vigilancia", "Moderado", "Crítico"];
const _dfiCap3 = n => Math.max(0, Math.min(3, n));
const _DFI_PMAP = { muy_delgado:"bajo_grasa", delgado:"bajo_grasa", normal:"normal", sobrepeso:"exceso", obesidad:"exceso" };
const _DFI_RISK = ["vomito","laxantes","diureticos","ayuno","ayuno_prolongado","ejercicio_excesivo"];
function _dfiFmt(v){ return v==null||isNaN(v) ? "-" : (Math.round(v*100)/100).toString().replace(".",","); }
function _dfiSigned(v){ const n=Math.round((v||0)*10)/10; return (n>=0?"+":"")+n.toString().replace(".",","); }
function _dfiIsLimiting(v){ return v && !["no","nunca","buena","alta","siempre_disponible",""].includes(v); }

function computeDFI({ idx, dv={}, bc={}, pt={}, icec={}, perc={}, hab={}, soc={}, epi={} }){
  if(!idx) return null;
  const famHx = (epi.famHx||[]).filter(f=>f && String(f).toLowerCase()!=="ninguna");
  // ---- Dominio 1 · Celular-Eléctrico (IFC × IRC, matiz IEHH) ----
  const ifcL = idx.ifcCl?.l, ircL = idx.ircCl?.l;
  const D1 = { "Alto|Bajo":0,"Alto|Normal":1,"Normal|Bajo":1,"Alto|Alto":2,"Normal|Normal":2,"Bajo|Bajo":2,"Normal|Alto":2,"Bajo|Normal":3,"Bajo|Alto":3 };
  let s1 = D1[`${ifcL}|${ircL}`]; if(s1==null) s1=1;
  const iehhAlt = idx.iehhCl && (idx.iehhCl.l==="Moderado"||idx.iehhCl.l==="Alto");
  if(iehhAlt) s1=_dfiCap3(s1+1);
  const dom1 = { id:"d1", nombre:"Celular-Eléctrico", icon:"🔬", sev:s1,
    clasif: idx.frL || `IFC ${ifcL} · IRC ${ircL}`,
    lectura: s1>=3?"Función celular comprometida con microambiente hostil.":s1===2?"Estado celular en presión: vigilar función y riesgo.":s1===1?"Función conservada con señal de riesgo a observar.":"Homeostasis celular: membranas íntegras y microambiente equilibrado.",
    items:[`IFC ${_dfiFmt(idx.ifc)} (${ifcL})`,`IRC ${_dfiFmt(idx.irc)} (${ircL})`,`IEHH ${_dfiFmt(idx.iehh)} (${idx.iehhCl?.l||"-"})`] };

    lectura: s2>=3?"Susceptibilidad cardiometabólica alta; fenotipo de riesgo.":s2===2?"Vulnerabilidad metabólica o fenotipo a corregir.":s2===1?"Susceptibilidad leve: prevención eficaz.":"Perfil metabólico-estructural favorable.",
    items:[`ISCM-BIS ${_dfiFmt(idx.iscm)} (${idx.iscmCl?.l||"-"})`,`Fenotipo: ${fen||"N/C"}`,`FMI ${_dfiFmt(dv.fmi)} · FFMI ${_dfiFmt(dv.ffmi)}`] };

  else s3 = iae>10?3:2;
  const dom3 = { id:"d3", nombre:"Envejecimiento", icon:"⏳", sev:s3,
    clasif:`IAE ${_dfiSigned(iae)} años · ${idx.iaeCl?.l||"-"}`,
    lectura: s3>=3?"Envejecimiento biológico marcadamente acelerado.":s3===2?"Envejecimiento acelerado: intervenir sobre función y masa.":s3===1?"Ritmo en el límite superior de lo esperado.":"Ritmo de envejecimiento esperado o enlentecido.",
    items:[`EB-BIS ${_dfiFmt(idx.ebBis)} años`,`Edad cronológica ${pt.edad ?? "-"} años`,`IAE ${_dfiSigned(iae)} años`] };
  // ---- Dominio 4 · Conductual-Perceptual ----
  let s4=0, veto=false; const f4=[];
  const methods = perc.methods||[];
  const tca = methods.some(m=>_DFI_RISK.includes(m));
  if(tca){ s4=3; veto=true; f4.push("Conducta de riesgo (posible TCA)"); }
  const distor = perc.bodyImage && _DFI_PMAP[perc.bodyImage] && idx.fmiCat && _DFI_PMAP[perc.bodyImage]!==idx.fmiCat;
  if(distor){ s4=Math.max(s4,2); f4.push("Distorsión de imagen corporal"); if(s4>=2) veto=veto||tca; }
  if(["frecuente","siempre","alto"].includes(perc.lossControl)){ s4=Math.max(s4,2); f4.push("Pérdida de control alimentario"); }
  if(["muy_insatisfecho","insatisfecho"].includes(perc.satisfaction)){ s4=Math.max(s4,1); f4.push("Insatisfacción corporal"); }
  const dom4 = { id:"d4", nombre:"Conductual-Perceptual", icon:"🪞", sev:s4, veto,
    clasif: s4>=3?"Conducta de riesgo":s4===2?"Distorsión / desajuste":s4===1?"Señal leve":"Sin distorsión",
    lectura: s4>=3?"Prioridad psicológica; excluye intervención nutricional restrictiva.":s4===2?"Distorsión o desajuste conductual: abordaje psicológico.":s4===1?"Señal conductual a vigilar.":"Relación con el cuerpo y la comida sin alertas.",
    items: f4.length?f4:["Percepción congruente con el fenotipo real"] };
  // ---- Dominio 5 · Epigenético-Contextual (ICEC/LE8 · contexto) ----
  const icecTotal = icec.total ?? null;

  const domains=[dom1,dom2,dom3,dom4,dom5];

  // ── Gráfica de línea con segmentos coloreados por mejora ──
  function lineFollow(key, cfg){
    const W=560,H=210,padL=48,padR=18,padT=22,padB=46, iw=W-padL-padR, ih=H-padT-padB;
    const pts = serie.map(function(s){ return { fecha:s.fecha, val:s[key] }; }).filter(function(p){ return p.val!=null && !isNaN(p.val); });
    if(pts.length<1) return CE("div",{style:{padding:26,textAlign:"center",color:"#94a3b8",fontSize:12}},"Sin datos de "+cfg.label);
    const vals=pts.map(function(p){return p.val;});
    let minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
    if(cfg.ref!=null){ minV=Math.min(minV,cfg.ref); maxV=Math.max(maxV,cfg.ref); }
    let span=maxV-minV||1; minV-=span*0.15; maxV+=span*0.15;
    const xOf=function(i){ return padL+(pts.length===1?iw/2:i*iw/(pts.length-1)); };
    const yOf=function(v){ return padT+ih-((v-minV)/(maxV-minV))*ih; };
    const yl=[],yt=[];
    for(let t=0;t<=4;t++){ const tv=minV+(maxV-minV)*t/4, ty=yOf(tv); yl.push(CE("line",{key:"yl"+t,x1:padL,y1:ty.toFixed(1),x2:W-padR,y2:ty.toFixed(1),stroke:"#eef2f7",strokeWidth:1})); yt.push(CE("text",{key:"yt"+t,x:padL-6,y:(ty+3).toFixed(1),textAnchor:"end",fontSize:9,fill:"#94a3b8"}, (Math.abs(tv)>=10?tv.toFixed(1):tv.toFixed(3)))); }
    const segs=[], dts=[];
    for(let i=0;i<pts.length;i++){
      const cx=xOf(i), cy=yOf(pts[i].val);
      if(i>0){
        const px=xOf(i-1), py=yOf(pts[i-1].val);
        const dlt=pts[i].val-pts[i-1].val;
        let better=null;
        if(Math.abs(dlt)<1e-9) better=null;
        else if(cfg.ref!=null) better=Math.abs(pts[i].val-cfg.ref)<Math.abs(pts[i-1].val-cfg.ref);
        else better=cfg.dir>0?dlt>0:dlt<0;
        const col = better===null?"#94a3b8":better?"#16a34a":"#dc2626";
        segs.push(CE("line",{key:"sg"+i,x1:px.toFixed(1),y1:py.toFixed(1),x2:cx.toFixed(1),y2:cy.toFixed(1),stroke:col,strokeWidth:2.6,strokeLinecap:"round"}));
      }
      dts.push(CE("g",{key:"dt"+i,transform:"translate("+cx.toFixed(1)+","+(padT+ih+12)+")"}, CE("text",{transform:"rotate(-32)",textAnchor:"end",fontSize:8,fill:"#94a3b8"},pts[i].fecha)));
    }
    const refLn = cfg.ref!=null ? CE("line",{x1:padL,y1:yOf(cfg.ref).toFixed(1),x2:W-padR,y2:yOf(cfg.ref).toFixed(1),stroke:"#0f766e",strokeWidth:1.2,strokeDasharray:"5 3"}) : null;
    const refTx = cfg.ref!=null ? CE("text",{x:W-padR,y:(yOf(cfg.ref)-4).toFixed(1),textAnchor:"end",fontSize:8,fontWeight:700,fill:"#0f766e"}, cfg.refLabel||("objetivo "+cfg.ref)) : null;
    const dots = pts.map(function(p,i){ const cx=xOf(i),cy=yOf(p.val); const dv=Math.abs(p.val)>=10?p.val.toFixed(1):p.val.toFixed(3); return CE("g",{key:"p"+i}, CE("circle",{cx:cx.toFixed(1),cy:cy.toFixed(1),r:i===pts.length-1?6:4,fill:i===pts.length-1?"#0F2D52":"#64748b",stroke:"white",strokeWidth:1.5}), CE("text",{x:cx.toFixed(1),y:(cy-9).toFixed(1),textAnchor:"middle",fontSize:8.5,fontWeight:700,fill:"#334155"},dv) ); });
    return CE("svg",{width:W,height:H,style:{display:"block",overflow:"visible",maxWidth:"100%"}}, yl,yt,refLn,refTx,segs,dts,dots);
  }

  // ── Radar DFI comparativo (inicial vs última, líneas de distinto color) ──
  function dfiCompara(){
    if(!dfiUlt) return CE("div",{style:{padding:26,textAlign:"center",color:"#94a3b8",fontSize:12}},"Faltan datos BIS para el radar funcional.");

      CE("polygon",{points:_radRing(_RAD_R),fill:"none",stroke:_RAD_OUTLINE,strokeWidth:"1.1"}),
      _RAD_ORDER.map(function(_,i){ const p=_radPt(i,_RAD_R); return CE("line",{key:"ax"+i,x1:_RAD_CX,y1:_RAD_CY,x2:p[0],y2:p[1],stroke:"#FFFFFF",strokeWidth:"1",opacity:"0.55"}); })
    );
    const mkPoly = function(lv,col,dash){ const ps=_radPoly(lv); return CE("g",null,
      CE("polygon",{points:ps,fill:"none",stroke:"#FFFFFF",strokeWidth:"5",strokeLinejoin:"round"}),

    ); };
    const labels = CE("g",null, _RAD_ORDER.map(function(id,i){ const p=_radPt(i,_RAD_R+22); const c=Math.cos(_radAng(i)); const anc=Math.abs(c)<0.34?"middle":c>0?"start":"end"; return CE("text",{key:id,x:p[0],y:p[1],fill:_RAD_NAVY,fontSize:"11",fontWeight:"700",textAnchor:anc,dominantBaseline:"middle"},_RAD_SHORT[id]); }));
    return CE("div",null,
      CE("svg",{viewBox:"-36 0 380 300",width:"100%",style:{maxWidth:420},fontFamily:"inherit"}, zones, lvIni?mkPoly(lvIni,COL_INI,"5 3"):null, mkPoly(lvUlt,COL_ULT,"0"), labels),
      CE("div",{style:{display:"flex",gap:16,justifyContent:"center",flexWrap:"wrap",marginTop:6}},
        CE("span",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:10,color:"#475569",fontWeight:600}}, CE("span",{style:{width:18,borderTop:"3px dashed "+COL_INI,display:"inline-block"}}), "Inicial · "+(serie.length?serie[0].fecha:"—")),
        CE("span",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:10,color:"#475569",fontWeight:600}}, CE("span",{style:{width:18,borderTop:"3px solid "+COL_ULT,display:"inline-block"}}), "Última · "+(fechaUlt||"actual"))
      ),
      CE("div",{style:{fontSize:9.5,color:_RAD_SLATE,textAlign:"center",marginTop:4}},"A menor polígono, mejor estado funcional. Líneas de distinto color = cambio entre consultas.")
    );
  }

  const Scard = { background:"white", border:"1px solid #e2e8f0", borderRadius:14, padding:"16px 18px", marginBottom:16 };
  const Stit = { fontSize:13, fontWeight:800, color:"#0f172a", marginBottom:4 };

  return CE("div",{style:{background:"#f8fafc",minHeight:"100vh",fontFamily:"'IBM Plex Sans',system-ui,sans-serif",padding:"20px 16px 60px",maxWidth:920,margin:"0 auto"}},
    CE("div",{style:{marginBottom:18}},
      CE("div",{style:{fontSize:20,fontWeight:900,color:"#0f766e",marginBottom:2}},"📈 Seguimiento funcional · ANI BIS-E"),
      CE("div",{style:{fontSize:12,color:"#64748b"}}, (e_.nombre||"—")+" · "+serie.length+" consulta"+(serie.length===1?"":"s"))
    ),
    serie.length===0 ? CE("div",{style:{textAlign:"center",padding:"40px 20px",color:"#94a3b8"}}, CE("div",{style:{fontSize:32,marginBottom:10}},"📈"), CE("div",{style:{fontSize:14,fontWeight:700,color:"#64748b"}},"Sin consultas guardadas aún"), CE("div",{style:{fontSize:11,marginTop:6}},"Guarda consultas desde BIS o Reporte/HC para ver la evolución.")) : CE("div",null,
      CE("div",{style:Scard},
        CE("div",{style:Stit},"⚡ Capacitancia de membrana (C) — parámetro de seguimiento"),
        CE("div",{style:Ssub},"Según protocolo, C es el parámetro a seguir. Mayor C = mejor integridad de membrana celular. Verde = mejora · rojo = retroceso."),
        lineFollow("C",{ label:"Capacitancia (C)", ref:null, dir:1 })
      ),
      CE("div",{style:Scard},
        CE("div",{style:Stit},"🧭 Diagnóstico Funcional — Inicial vs Última"),

        dfiCompara()

      CE("div",{style:Scard},

        CE("div",{style:Ssub},"PABU debe acercarse a φ = 1,618 (línea punteada). ICA-BIS es la distancia a φ: el objetivo es que tienda a 0."),
        CE("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}},
          CE("div",null, CE("div",{style:{fontSize:11,fontWeight:800,color:"#334155",marginBottom:6}},"PABU → φ (1,618)"), lineFollow("pabu",{ label:"PABU", ref:1.618, refLabel:"φ = 1,618" })),
          CE("div",null, CE("div",{style:{fontSize:11,fontWeight:800,color:"#334155",marginBottom:6}},"ICA-BIS → 0 (distancia a φ)"), lineFollow("ica",{ label:"ICA-BIS", ref:0, refLabel:"objetivo 0" }))

const calcPorcionesANI = (protG, choG, fatG) => {
  const prot=protG||0, cho=choG||0, fat=fatG||0;
  const lac=2, huev=1, verd=2;
  const leg = prot>=70 ? 2 : 1;
  const protAnchor = lac*7+huev*6+leg*8;
  const protAnim = Math.max(2, Math.round(Math.max(0,prot-protAnchor)/17));
  const choAnchor = lac*12+leg*20+verd*5;
  const choRem = Math.max(0, cho-choAnchor);
  const fruta  = Math.max(1, Math.round(choRem*0.30/15));
  const pan    = Math.max(0, Math.round(choRem*0.15/20));
  const tub    = Math.max(0, Math.round(choRem*0.10/15));
  const cereal = Math.max(2, Math.round(Math.max(0,choRem-fruta*15-pan*20-tub*15)/30));
  const fatProt = protAnim*3+huev*5+lac*3;
  const fatRem  = Math.max(0, fat-fatProt);
  const aguac   = Math.max(0, Math.round(fatRem*0.5/5));
  const aceite  = Math.max(1, Math.round(Math.max(0,fatRem-aguac*5)/5));
  return [protAnim,huev,lac,leg,cereal,pan,tub,fruta,verd,aceite,aguac];
};
const distribPorTiemposANI = (total, tiemposArr) => {
  const base = tiemposArr.map(t=>Math.floor(total*t.p));
  let rem = total - base.reduce((a,b)=>a+b,0);
  tiemposArr.map((t,i)=>({i,f:total*t.p-base[i]})).sort((a,b)=>b.f-a.f).forEach(({i})=>{if(rem>0){base[i]++;rem--;}});
  return base;
};
const generarMenuANI = (porcWork, tiemposArr) => {
  const nT=tiemposArr.length, DIAS_N=7;
  if(!porcWork||porcWork.length===0) return Array.from({length:DIAS_N},()=>Array(nT).fill("\u2014"));
  const FOODS=[
    ["Pechuga a la plancha","Carne a la plancha","Atún","Pollo asado","Pescado al horno","Cerdo asado","Pollo estofado"],
    ["Huevo revuelto","Huevo cocido","Tortilla","Huevo frito","Huevo revuelto","Huevo cocido","Tortilla"],
    ["Leche","Yogur natural","Kumis","Leche descremada","Yogur","Kumis","Leche"],
    ["Fríjoles","Lentejas","Garbanzos","Arvejas","Fríjoles","Lentejas","Garbanzos"],
    ["Arroz cocido","Avena","Pasta integral","Arroz","Quínua","Avena","Arroz"],
    ["Pan integral","Arepa","Pan integral","Arepa","Tostadas","Pan","Arepa"],
    ["Papa cocida","Plátano","Yuca","Papa","Plátano asado","Papa","Yuca"],
    ["Banano","Mango","Papaya","Manzana","Pera","Guayaba","Mandarina"],
    ["Lechuga+tomate","Brócoli+zanahoria","Ensalada verde","Espinaca+pepino","Pepino+tomate","Zanahoria","Remolacha"],
    ["Aceite de oliva","Aceite","Aceite de oliva","Aceite","Aceite de oliva","Aceite","Aceite"],
    ["Aguacate","Aguacate","Aguacate","Aguacate","Aguacate","Aguacate","Aguacate"],
  ];
  return Array.from({length:DIAS_N},(_,di)=>
    Array.from({length:nT},(_,ti)=>{
      const items=[];
      for(let gi=0;gi<GRUPOS_ANI.length;gi++){
        const v=porcWork[gi]?(porcWork[gi][ti]||0):0;
        if(v>0&&gi<FOODS.length){ const food=FOODS[gi][di%7]; items.push(v>1?v+"\u00D7"+food:food); }
      }
      return items.length>0?items.join(" + "):"\u2014";
    })
  );
};

const motorProtocolo = (bis, enc, motor) => {

  const diagnosticos = Array.isArray(enc?.d5_39) ? enc.d5_39 : [];
  const fenotipo = motor?.fenotipo?.id || 'F11';
  const sector = motor?.sectorFR || 'S4';
  const irc = Number(bis?.irc||enc?.irc)||0;
  const iscm = Number(bis?.iscm||enc?.iscm)||0;
  const iehh = Number(bis?.iehh||enc?.iehh)||0;
  const iae = Number(bis?.iae||enc?.iae)||0;
  const FMI = Number(bis?.FMI||enc?.FMI)||0;
  const FFMI = Number(bis?.FFMI||enc?.FFMI)||0;
  const peso = Number(bis?.peso||enc?.peso)||0;
  const talla = Number(bis?.talla||enc?.talla)||0;
  const FFM = Number(bis?.FFM||enc?.FFM)||0;
  const imc = Number(bis?.imc||enc?.imc)||0;
  const tieneIRC = diagnosticos.some(d => d.toLowerCase().includes('renal'));
  const tieneCancer = diagnosticos.some(d => d.toLowerCase().includes('cáncer')||d.toLowerCase().includes('cancer'));
  const tieneDM = diagnosticos.some(d => d.toLowerCase().includes('diabet'));
  const tieneHTA = diagnosticos.some(d => d.toLowerCase().includes('hipert')||d.toLowerCase().includes('hta')) || enc?.d5_36==='Sí';
  const tieneObesidadSarcopenica = motor?.obesidadSarcopenica || false;
  const PI = sexoM ? talla-100-((talla-150)/4) : talla-100-((talla-150)/2.5);
  const pesoCalculo = tieneIRC||tieneCancer ? peso : imc<25 ? peso : PI+0.25*(peso-PI);
  const pesoCalculoLabel = tieneIRC||tieneCancer ? 'Peso actual (IRC/Cáncer — sin restricción)' : imc<25 ? 'Peso actual (IMC normal)' : 'Peso ajustado (obesidad)';
  const estrategia = (() => {
    if (tieneCancer || ['F7','F10'].includes(fenotipo)) return { tipo:'Hipercalórico', deficit:-300, label:'Hipercalórico +300 kcal/día', color:'#16a34a', ref:'ESPEN 2023 — cáncer/desnutrición' };
    if (fenotipo==='F1'||tieneObesidadSarcopenica) return { tipo:'Hipocalórico moderado', deficit:500, label:'Hipocalórico moderado −500 kcal/día', color:'#f59e0b', ref:'ESPEN 2023 — obesidad sarcopénica: no restricción agresiva' };
    if (['F2','F3'].includes(fenotipo)) return { tipo:'Hipocalórico', deficit:600, label:'Hipocalórico −600 kcal/día', color:'#ea580c', ref:'ESPEN 2023 — obesidad clínica' };
    if (['F4','F5'].includes(fenotipo)) return { tipo:'Hipocalórico leve', deficit:300, label:'Hipocalórico leve −300 kcal/día', color:'#f59e0b', ref:'ESPEN 2023 — obesidad preclínica' };
    if (fenotipo==='F11') return { tipo:'Mantenimiento', deficit:0, label:'Mantenimiento calórico', color:'#16a34a', ref:'Sin restricción — composición adecuada' };
    return { tipo:'Mantenimiento', deficit:0, label:'Mantenimiento calórico', color:'#16a34a', ref:'Sin restricción' };
  })();
  const protMin = (() => { if (tieneIRC) return 0.6; if (tieneCancer) return 1.5; if (fenotipo==='F1'||tieneObesidadSarcopenica) return 1.2; if (['F7','F10'].includes(fenotipo)) return 1.5; return 0.8; })();
  const protMax = (() => { if (tieneIRC) return 0.8; if (tieneCancer) return 2.0; if (fenotipo==='F1'||tieneObesidadSarcopenica) return 1.5; if (['F7','F10'].includes(fenotipo)) return 2.0; return 1.2; })();
  const protRef = tieneIRC ? 'KDIGO 2024' : tieneCancer ? 'ESPEN Oncología 2023' : tieneObesidadSarcopenica ? 'ESPEN Sarcopenia 2023' : 'ESPEN 2023';
  const restricciones = [
    tieneIRC ? { nombre:'Proteína', valor:'0.6–0.8 g/kg', ref:'KDIGO 2024' } : null,
    tieneIRC ? { nombre:'Fósforo', valor:'< 800 mg/día', ref:'KDIGO 2024' } : null,
    tieneIRC ? { nombre:'Potasio', valor:'< 2000 mg/día', ref:'KDIGO 2024' } : null,

  ].filter(Boolean);
  const examenes = [
    tieneIRC ? { nombre:'Creatinina sérica', razon:'Monitoreo función renal', protocolo:'KDIGO 2024', prioridad:'alta' } : null,
    tieneIRC ? { nombre:'TFG estimada', razon:'Estadificación ERC', protocolo:'KDIGO 2024', prioridad:'alta' } : null,
    tieneIRC ? { nombre:'BUN', razon:'Carga nitrogenada', protocolo:'KDIGO 2024', prioridad:'alta' } : null,

    iae > 5 ? { nombre:'Coenzima Q10', dosis:'100mg/día', razon:'Envejecimiento acelerado IAE +'+iae.toFixed(1), vitacellebis:'COQBIS' } : null,
  ].filter(Boolean);

};
